<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pondokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF3FF" />
      <stop offset="100%" stop-color="#FFF8E7" />
    </linearGradient>
    <linearGradient id="peciPondok" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212F3D" />
      <stop offset="100%" stop-color="#17202A" />
    </linearGradient>
  </defs>

  <!-- Background Lingkaran Halus -->
  <circle cx="32" cy="32" r="30" fill="url(#pondokBg)" stroke="#FFE69A" stroke-width="2" />

  <!-- Baju Koko Santri Putih -->
  <path d="M 16 60 Q 32 46 48 60 Z" fill="#FFFFFF" stroke="#D5E5F2" stroke-width="1.5" />
  
  <!-- Sorban Selempang di Pundak Khas Anak Pondok (Warna Hijau Sage / Toska Santri) -->
  <path d="M 17 52 Q 22 46 27 48 L 29 60 L 19 60 Z" fill="#78B0A0" stroke="#5C9384" stroke-width="1" />
  <path d="M 23 48 L 25 60 M 20 54 L 28 52" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" stroke-linecap="round" />

  <!-- Kerah Baju Koko & Kancing Santri -->
  <path d="M 29 49 L 32 53 L 35 49" fill="none" stroke="#24344D" stroke-width="1.3" stroke-linecap="round" />
  <circle cx="32" cy="55" r="1" fill="#24344D" />

  <!-- Leher -->
  <rect x="29" y="43" width="6" height="7" rx="2" fill="#FDDCB8" />

  <!-- Kepala & Wajah Chibi Santri -->
  <ellipse cx="32" cy="33" rx="15" ry="14" fill="#FFE5CC" />

  <!-- Telinga -->
  <circle cx="17" cy="33" r="3" fill="#FDDCB8" />
  <circle cx="47" cy="33" r="3" fill="#FDDCB8" />

  <!-- Rambut Rapi Khas Santri -->
  <path d="M 17 25 Q 19 29 18 33" stroke="#24344D" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <path d="M 47 25 Q 45 29 46 33" stroke="#24344D" stroke-width="2.2" fill="none" stroke-linecap="round" />

  <!-- Peci Hitam Khas Santri Pondok (Songkok Nasional) -->
  <path d="M 16 25 C 18 14, 46 14, 48 25 Z" fill="url(#peciPondok)" />
  <!-- Garis lipatan & aksen emas tipis songkok -->
  <path d="M 16 25 Q 32 27 48 25" stroke="#E5C058" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <rect x="30" y="15" width="4" height="2" rx="1" fill="#E5C058" opacity="0.8" />

  <!-- Alis Santri Ramah & Ceria -->
  <path d="M 22 28 Q 26 26.5 28 28" stroke="#24344D" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M 36 28 Q 38 26.5 42 28" stroke="#24344D" stroke-width="1.3" fill="none" stroke-linecap="round" />

  <!-- Mata Chibi Berbinar Bahagia -->
  <ellipse cx="25" cy="32" rx="2.2" ry="3" fill="#24344D" />
  <circle cx="26" cy="31" r="0.8" fill="#FFFFFF" />
  <ellipse cx="39" cy="32" rx="2.2" ry="3" fill="#24344D" />
  <circle cx="40" cy="31" r="0.8" fill="#FFFFFF" />

  <!-- Blush Pipi Khas Anak Muda -->
  <ellipse cx="21" cy="36" rx="2.8" ry="1.6" fill="#FFB4C4" />
  <ellipse cx="43" cy="36" rx="2.8" ry="1.6" fill="#FFB4C4" />

  <!-- Senyum Ceria Sahabat -->
  <path d="M 29 38 Q 32 42 35 38" stroke="#E63956" stroke-width="1.6" fill="none" stroke-linecap="round" />

  <!-- Bintang Sparkle -->
  <text x="47" y="19" font-size="8" fill="#FFAE03">✨</text>
</svg>
